name: Docker Full QA preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Never permit an older run to overwrite a later main image.
concurrency:
  group: full-qa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Full QA ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build full QA preview (source and approved-product gates unchanged)
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build -f Dockerfile.qa-full --platform "linux/$ARCH" \
            --build-arg "BODICH_GIT_SHA=$SHA" \
            -t bodich-full-qa:local .
      - name: Run isolated QA image and smoke bilingual content
        shell: bash
        run: |
          docker run -d --name bodich-qa --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 \
            --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
            -p 127.0.0.1:4321:8080 bodich-full-qa:local
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/en/qa/ >/dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          import re
          from html.parser import HTMLParser
          from urllib.error import HTTPError
          from urllib.request import urlopen

          base = 'http://127.0.0.1:4321'
          concept = '/images/turbines/bodich-card-concept-01'
          primary = concept + '.webp'
          srcset = f'{concept}-360.webp 360w, {concept}-600.webp 600w'
          alt = {
              'en': 'BODICH turbine concept art',
              'ro': 'Concept ilustrativ de turbină BODICH',
          }
          captions = {
              'en': 'AI-generated illustrative concept art; not an exact model photograph.',
              'ro': 'Imagine conceptuală ilustrativă generată cu IA; nu este o fotografie a modelului exact.',
          }
          class ImageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'img':
                      self.images.append(values)
                  elif tag == 'a' and 'data-qa-external-source' in values:
                      self.sources.append(values)
          def get(path):
              with urlopen(base + path, timeout=10) as r:
                  assert r.status == 200, (path, r.status)
                  return r.read().decode('utf8', errors='replace')
          def check_images(html, locale, count):
              assert 'qa-art/' not in html
              assert captions[locale] in html
              parser = ImageParser()
              parser.feed(html)
              images = [img for img in parser.images if img.get('src') == primary]
              assert len(images) == count, (locale, count, len(images))
              for img in images:
                  assert img.get('srcset') == srcset
                  assert img.get('alt') == alt[locale]
                  assert img.get('sizes') and img.get('width') == '600' and img.get('height') == '450'
                  assert img.get('loading') in ('lazy', 'eager')
              return images
          records = json.load(open('docs/catalog/reference-overrides.json', encoding='utf8'))['records']
          inventory = json.load(open('docs/catalog/source-inventory.json', encoding='utf8'))['products']
          source_urls = {item['id']: item['canonicalUrl'] for item in inventory}
          assert len(records) == len(source_urls) == 132
          for locale in ('en', 'ro'):
              landing = get(f'/{locale}/qa/')
              assert 'data-qa-catalog' in landing
              assert 'data-media-profile="qa_full"' in landing
              assert 'noindex, nofollow' in landing
              assert len(re.findall(f'href="/{locale}/qa/[^"]+/"', landing)) == 132
              assert all(i.get('loading') == 'lazy' for i in check_images(landing, locale, 132))
              for record in records:
                  detail = get(f'/{locale}/qa/{record["slug"]}/')
                  assert 'data-qa-detail="' + record['sourceId'] + '"' in detail
                  assert 'noindex, nofollow' in detail
                  parsed = ImageParser()
                  parsed.feed(detail)
                  assert len(parsed.sources) == 1, (locale, record['slug'], parsed.sources)
                  assert parsed.sources[0].get('href') == source_urls[record['sourceId']], record['slug']
                  assert check_images(detail, locale, 1)[0]['loading'] == 'eager'
              home = get(f'/{locale}/')
              assert 'data-full-qa-notice' in home
              assert '/images/turbines/bodich-hero-concept.webp' in home
          for path in [primary, concept + '-360.webp', concept + '-600.webp',
                       '/images/turbines/bodich-hero-concept.webp']:
              with urlopen(base + path, timeout=10) as r:
                  assert r.status == 200 and r.headers.get_content_type() == 'image/webp', path
                  assert r.read(12)[8:12] == b'WEBP', path
          try:
              get('/qa-art/' + records[0]['sourceId'] + '.webp')
              raise AssertionError('Offline schematic unexpectedly published')
          except HTTPError as exc:
              assert exc.code == 404
          assert 'Disallow: /' in get('/robots.txt')
          print('Full-content QA HTTP smoke passed: 132 x 2 details, one AI concept, 3 WebP variants')
          PY
          test "$(docker image inspect --format '{{index .Config.Labels "org.bodich.profile"}}' bodich-full-qa:local)" = qa_full
          docker run --rm --entrypoint sh bodich-full-qa:local -ec '
            ! command -v node
            ! command -v npm
            test ! -d /app
            test ! -e /usr/share/nginx/html/docs/catalog
          '
      # Both architectures run HTTP smoke; Chromium smoke only runs on amd64.
      - name: Install browser QA dependencies on the host runner
        if: matrix.arch == 'amd64'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Run real Chromium image-loading smoke for EN and RO QA routes
        if: matrix.arch == 'amd64'
        run: |
          npm ci
          ./node_modules/.bin/playwright install --with-deps --only-shell chromium
          node scripts/verify-qa-full-browser.mjs
      - name: Log errors
        if: failure()
        run: docker logs bodich-qa || true
      - name: Export tested image for publishing
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker save -o "$RUNNER_TEMP/bodich-full-qa-${{ matrix.arch }}.tar" bodich-full-qa:local
      - name: Upload tested image artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: bodich-full-qa-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/bodich-full-qa-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error
      - name: Stop QA
        if: always()
        run: docker rm -f bodich-qa || true
    permissions:
      contents: read

  publish-arch:
    name: Push previously tested QA ${{ matrix.arch }} image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bodich-full-qa-image-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image without rebuilding
        env:
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker load -i "$RUNNER_TEMP/bodich-full-qa-$ARCH.tar"
          docker tag bodich-full-qa:local "ghcr.io/yuriisokolenko/bodich-full-qa-preview:sha-$SHA-$ARCH"
          docker push "ghcr.io/yuriisokolenko/bodich-full-qa-preview:sha-$SHA-$ARCH"

  publish-multiarch:
    name: Publish tested multi-arch QA image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: publish-arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the exact tested architecture images
        env:
          SHA: ${{ github.sha }}
        run: |
          repo=ghcr.io/yuriisokolenko/bodich-full-qa-preview
          docker buildx imagetools create -t "$repo:main" \
            "$repo:sha-$SHA-amd64" "$repo:sha-$SHA-arm64"
          docker buildx imagetools inspect "$repo:main"
