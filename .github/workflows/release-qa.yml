name: Stage 20D Release QA (automated only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - '.nvmrc'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/release-qa.mjs'
      - 'scripts/verify-release-qa-install.mjs'
      - 'scripts/verify-release-qa-dist.mjs'
      - 'scripts/lib/release-qa-policy.mjs'
      - 'scripts/lib/release-manifest.mjs'
      - 'scripts/verify-release-qa.mjs'
      - 'docs/qa/issue-69-*'
      - '.github/workflows/release-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-20d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR tests must build the exact head, not GitHub's synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install website and QA tools from one committed lockfile
        run: npm ci

      - name: Verify full locked dependency tree and reject manifest drift
        run: |
          npm run qa:lock:self-test
          npm run qa:lock:check

      - name: Validate evidence matrix and fail-closed self-tests
        run: |
          npm run qa:evidence:check
          npm run qa:evidence:self-test

      - name: Build release-safe informational website
        run: npm run build

      - name: Record exact release-safe build manifest before installing Chromium
        run: npm run qa:dist:record

      # Use only the Playwright binary installed by npm ci; no npx registry fallback.
      # This installs browser binaries, never npm packages or a rebuilt dist tree.
      - name: Install Chromium matching locked Playwright
        run: ./node_modules/.bin/playwright install chromium

      - name: Assert Chromium installation did not change release-safe dist
        run: npm run qa:dist:verify

      - name: Start local preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/bodich-release-qa-preview.log 2>&1 &
          echo $! > /tmp/bodich-release-qa-preview.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4321/en/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bodich-release-qa-preview.log
          exit 1

      - name: WCAG 2.2 axe scans and three-run mobile Lighthouse budgets
        env:
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run qa:release

      # Also compares checkout source SHA and committed lockfile SHA-256 to the
      # pre-audit baseline; the step never merely checks for an existing dist/.
      - name: Assert release-safe dist is still identical after all audits
        if: always()
        shell: bash
        run: |
          if [ -f visual-qa/release-qa/build-integrity.json ]; then
            npm run qa:dist:verify
          else
            echo "Build baseline unavailable: preceding stage already failed before the build"
          fi

      - name: Upload machine-readable axe findings and raw Lighthouse runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-20d-automated-qa-${{ github.run_id }}
          path: visual-qa/release-qa/
          if-no-files-found: warn
          retention-days: 30
