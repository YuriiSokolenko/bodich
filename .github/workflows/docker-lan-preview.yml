name: Docker LAN preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-preview:
    name: Docker preview ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      BODICH_BIND_IP: 127.0.0.1
      BODICH_PORT: 4321
      BODICH_SOURCE_STATE: clean
      BODICH_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Seed ignored host artifacts to verify context isolation
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p dist node_modules
          printf '<html>BODICH_MEDIA_PROFILE=beta_presentation HOST_STALE_DIST</html>' > dist/index.html
          printf 'HOST_NODE_MODULES_MUST_NOT_ENTER_IMAGE' > node_modules/host-context-marker
          printf 'FAKE_LOCAL_SECRET_MUST_NOT_ENTER_IMAGE' > .env.local
          printf '//registry.npmjs.org/:_authToken=fake-test-token' > .npmrc
      - name: Build and start release-safe preview on loopback
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: docker compose up --build --detach
      - name: Check EN/RO routes, assets, and HTTP security
        run: python3 scripts/docker-preview-smoke.py http://127.0.0.1:4321/
      - name: Verify runtime isolation and exact build provenance
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          container="$(docker compose ps -q bodich-preview)"
          test -n "$container"
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = "101:101"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container")" = "true"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$container" | grep -q 'ALL'
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container" | grep -q 'no-new-privileges'
          docker inspect --format '{{json .HostConfig.PortBindings}}' "$container" | grep -q '127.0.0.1'
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' bodich-lan-preview:local)" = "$TARGET_PLATFORM"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' bodich-lan-preview:local)" = "$EXPECTED_SOURCE_SHA"
          docker run --rm --entrypoint sh bodich-lan-preview:local -ec '
            for path in /usr/local/bin/node /usr/local/bin/npm /app /etc/nginx/conf.d/default.conf /usr/share/nginx/html/docs /usr/share/nginx/html/_headers; do
              test ! -e "$path" || { echo "unexpected runtime path: $path"; exit 1; }
            done
            ! command -v node
            ! command -v npm
            test ! -e /usr/share/nginx/html/HOST_STALE_DIST
            ! grep -R -E "BODICH_MEDIA_PROFILE=beta_presentation|FAKE_LOCAL_SECRET_MUST_NOT_ENTER_IMAGE|fake-test-token|HOST_STALE_DIST" /usr/share/nginx/html
            test -f /usr/share/nginx/html/en/index.html
            test -f /usr/share/nginx/html/ro/index.html
          '
          docker compose exec --no-TTY bodich-preview cat /usr/share/bodich/build-provenance.json > "$RUNNER_TEMP/bodich-build-provenance.json"
          python3 - "$RUNNER_TEMP/bodich-build-provenance.json" <<'PY'
          import json, os, re, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              p = json.load(f)
          assert p['profile'] == 'release_safe'
          assert p['sourceSha'] == os.environ['EXPECTED_SOURCE_SHA']
          assert p['sourceState'] == 'clean'
          assert re.fullmatch(r'[0-9a-f]{64}', p['distManifestSha256'])
          assert p['distFileCount'] > 0
          summary = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary, 'a', encoding='utf-8') as f:
              f.write(f"\n### {os.environ['TARGET_PLATFORM']} Docker preview\n\n")
              f.write(f"- PR head SHA: `{p['sourceSha']}`\n- Release-safe dist manifest SHA-256: `{p['distManifestSha256']}`\n- Files: `{p['distFileCount']}`\n")
          print(json.dumps(p, sort_keys=True))
          PY
      - name: Verify npm ci rejects a manifest-lockfile mismatch
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp Dockerfile package.json package-lock.json "$tmp/"
          python3 - "$tmp/package.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          with open(p, encoding='utf-8') as f:
              package = json.load(f)
          package['devDependencies']['playwright'] = '1.63.0' if package['devDependencies']['playwright'] != '1.63.0' else '1.64.1'
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(package, f)
          PY
          if docker build --progress=plain --target dependencies -t bodich-invalid-lock-fixture "$tmp" > "$tmp/build.log" 2>&1; then
            cat "$tmp/build.log"
            echo "npm ci unexpectedly accepted the mismatched lockfile"
            exit 1
          fi
          grep -E 'EUSAGE|in sync|Invalid:' "$tmp/build.log"
      - name: Verify missing lockfile prevents a Docker build
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp Dockerfile package.json "$tmp/"
          if docker build --progress=plain --target dependencies -t bodich-missing-lock-fixture "$tmp" > "$tmp/build.log" 2>&1; then
            cat "$tmp/build.log"
            echo "Docker build unexpectedly accepted a missing package-lock.json"
            exit 1
          fi
          grep 'package-lock.json' "$tmp/build.log"
      - name: Verify a forced post-gate failure cannot export an image
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          if docker build --platform "$DOCKER_DEFAULT_PLATFORM" --target fail-closed-fixture -t bodich-fail-closed-fixture . > "$RUNNER_TEMP/bodich-fail-closed.log" 2>&1; then
            cat "$RUNNER_TEMP/bodich-fail-closed.log"
            echo "Fail-closed fixture unexpectedly built an image"
            exit 1
          fi
          grep 'INTENTIONAL_FAIL_CLOSED_FIXTURE' "$RUNNER_TEMP/bodich-fail-closed.log"
          if docker image inspect bodich-fail-closed-fixture >/dev/null 2>&1; then
            echo "A runtime image was exported from the failing build"
            exit 1
          fi
          python3 scripts/docker-preview-smoke.py http://127.0.0.1:4321/
      - name: Show preview logs after failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop preview
        if: always()
        run: docker compose down --remove-orphans
