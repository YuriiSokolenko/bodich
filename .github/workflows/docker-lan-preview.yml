name: Docker LAN preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Single source of truth for "may this run publish an image to GHCR?".
  # Publishing is allowed only for pushes to main and for pull requests whose
  # head branch lives in this repository. Fork pull requests and Dependabot
  # pull requests never publish and never export the image. Dependabot is
  # rejected by PR author as well as by event actor: github.actor is whoever
  # triggered the event (a human can synchronize or reopen a Dependabot PR),
  # while its workflows only ever get a read-only token.
  # scripts/ghcr-publish.test.mjs runs this exact script against its cases.
  gate:
    name: Decide GHCR publishing
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          publish=false
          if [ "$EVENT_NAME" = push ] && [ "$REF" = refs/heads/main ]; then
            publish=true
          elif [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPO" = "$REPO" ] \
            && [ "$ACTOR" != 'dependabot[bot]' ] && [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "GHCR publishing: $publish (event=$EVENT_NAME, head repo=${HEAD_REPO:-n/a}, actor=$ACTOR, PR author=${PR_AUTHOR:-n/a})"

  docker-preview:
    name: Docker preview ${{ matrix.platform }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BODICH_BIND_IP: 127.0.0.1
      BODICH_PORT: 4321
      BODICH_SOURCE_STATE: clean
      BODICH_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate GHCR Compose override keeps runtime hardening
        env:
          BODICH_IMAGE_TAG: pr-1
        run: |
          docker compose -f compose.yaml -f compose.ghcr.yaml config --quiet
          docker compose -f compose.yaml -f compose.ghcr.yaml config --format json > "$RUNNER_TEMP/ghcr-compose.json"
          python3 - "$RUNNER_TEMP/ghcr-compose.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              svc = json.load(f)['services']['bodich-preview']
          assert svc['image'] == 'ghcr.io/yuriisokolenko/bodich-lan-preview:pr-1', svc['image']
          assert 'build' not in svc, 'override must never fall back to a local build'
          assert svc['pull_policy'] == 'always'
          assert svc['read_only'] is True
          assert svc['cap_drop'] == ['ALL']
          assert 'no-new-privileges:true' in svc['security_opt']
          assert svc['pids_limit'] == 64
          assert int(svc['mem_limit']) == 512 * 1024 * 1024
          assert float(svc['cpus']) == 1.0
          assert any(t.startswith('/tmp:') and 'noexec' in t for t in svc['tmpfs'])
          assert svc['ports'][0]['target'] == 8080
          PY
      - name: Seed ignored host artifacts to verify context isolation
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p dist node_modules
          printf '<html>BODICH_MEDIA_PROFILE=beta_presentation HOST_STALE_DIST</html>' > dist/index.html
          printf 'HOST_NODE_MODULES_MUST_NOT_ENTER_IMAGE' > node_modules/host-context-marker
          printf 'FAKE_LOCAL_SECRET_MUST_NOT_ENTER_IMAGE' > .env.local
          printf '//registry.npmjs.org/:_authToken=fake-test-token' > .npmrc
      - name: Build and start release-safe preview on loopback
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: docker compose up --build --detach
      - name: Check EN/RO routes, assets, and HTTP security
        run: python3 scripts/docker-preview-smoke.py http://127.0.0.1:4321/
      - name: Check browser CSS/JS loads and EN/RO navigation over HTTP
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker build --platform "$TARGET_PLATFORM" --target browser-smoke -t bodich-preview-browser:local .
          docker run --rm --network host --platform "$TARGET_PLATFORM" \
            bodich-preview-browser:local http://127.0.0.1:4321
      - name: Verify runtime isolation and exact build provenance
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          container="$(docker compose ps -q bodich-preview)"
          test -n "$container"
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = "101:101"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container")" = "true"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$container" | grep -q 'ALL'
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container" | grep -q 'no-new-privileges'
          docker inspect --format '{{json .HostConfig.PortBindings}}' "$container" | grep -q '127.0.0.1'
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' bodich-lan-preview:local)" = "$TARGET_PLATFORM"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' bodich-lan-preview:local)" = "$EXPECTED_SOURCE_SHA"
          docker run --rm --entrypoint sh bodich-lan-preview:local -ec '
            for path in /usr/local/bin/node /usr/local/bin/npm /app /etc/nginx/conf.d/default.conf /usr/share/nginx/html/docs /usr/share/nginx/html/_headers; do
              test ! -e "$path" || { echo "unexpected runtime path: $path"; exit 1; }
            done
            ! command -v node
            ! command -v npm
            test ! -e /usr/share/nginx/html/HOST_STALE_DIST
            ! grep -R -E "BODICH_MEDIA_PROFILE=beta_presentation|FAKE_LOCAL_SECRET_MUST_NOT_ENTER_IMAGE|fake-test-token|HOST_STALE_DIST" /usr/share/nginx/html
            test -f /usr/share/nginx/html/en/index.html
            test -f /usr/share/nginx/html/ro/index.html
          '
          docker compose exec --no-TTY bodich-preview cat /usr/share/bodich/build-provenance.json > "$RUNNER_TEMP/bodich-build-provenance.json"
          python3 - "$RUNNER_TEMP/bodich-build-provenance.json" <<'PY'
          import json, os, re, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              p = json.load(f)
          assert p['profile'] == 'release_safe'
          assert p['sourceSha'] == os.environ['EXPECTED_SOURCE_SHA']
          assert p['sourceState'] == 'clean'
          assert re.fullmatch(r'[0-9a-f]{64}', p['distManifestSha256'])
          assert p['distFileCount'] > 0
          summary = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary, 'a', encoding='utf-8') as f:
              f.write(f"\n### {os.environ['TARGET_PLATFORM']} Docker preview\n\n")
              f.write(f"- PR head SHA: `{p['sourceSha']}`\n- Release-safe dist manifest SHA-256: `{p['distManifestSha256']}`\n- Files: `{p['distFileCount']}`\n")
          print(json.dumps(p, sort_keys=True))
          PY
      - name: Verify npm ci rejects a manifest-lockfile mismatch
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp Dockerfile package.json package-lock.json "$tmp/"
          python3 - "$tmp/package.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          with open(p, encoding='utf-8') as f:
              package = json.load(f)
          package['devDependencies']['playwright'] = '1.63.0' if package['devDependencies']['playwright'] != '1.63.0' else '1.64.1'
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(package, f)
          PY
          if docker build --progress=plain --target dependencies -t bodich-invalid-lock-fixture "$tmp" > "$tmp/build.log" 2>&1; then
            cat "$tmp/build.log"
            echo "npm ci unexpectedly accepted the mismatched lockfile"
            exit 1
          fi
          grep -E 'EUSAGE|in sync|Invalid:' "$tmp/build.log"
      - name: Verify missing lockfile prevents a Docker build
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp Dockerfile package.json "$tmp/"
          if docker build --progress=plain --target dependencies -t bodich-missing-lock-fixture "$tmp" > "$tmp/build.log" 2>&1; then
            cat "$tmp/build.log"
            echo "Docker build unexpectedly accepted a missing package-lock.json"
            exit 1
          fi
          grep 'package-lock.json' "$tmp/build.log"
      - name: Verify a forced post-gate failure cannot export an image
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          if docker build --platform "$DOCKER_DEFAULT_PLATFORM" --target fail-closed-fixture -t bodich-fail-closed-fixture . > "$RUNNER_TEMP/bodich-fail-closed.log" 2>&1; then
            cat "$RUNNER_TEMP/bodich-fail-closed.log"
            echo "Fail-closed fixture unexpectedly built an image"
            exit 1
          fi
          grep 'INTENTIONAL_FAIL_CLOSED_FIXTURE' "$RUNNER_TEMP/bodich-fail-closed.log"
          if docker image inspect bodich-fail-closed-fixture >/dev/null 2>&1; then
            echo "A runtime image was exported from the failing build"
            exit 1
          fi
          python3 scripts/docker-preview-smoke.py http://127.0.0.1:4321/
      # Hand the exact image that passed every check above to the publishing
      # jobs. Nothing is rebuilt for publishing, and this job never gets
      # packages: write. Fork and Dependabot pull requests never export it
      # (see the gate job).
      - name: Export tested image for publishing
        if: ${{ needs.gate.outputs.publish == 'true' }}
        run: docker save --output "$RUNNER_TEMP/bodich-lan-preview-${{ matrix.arch }}.tar" bodich-lan-preview:local
      - name: Upload tested image for publishing
        if: ${{ needs.gate.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bodich-lan-preview-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/bodich-lan-preview-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error
      - name: Show preview logs after failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop preview
        if: always()
        run: docker compose down --remove-orphans

  # Publishing jobs. They run only after every Docker preview check passed on
  # both architectures, and they push the exact image those checks tested (no
  # rebuild). Only these jobs get packages: write.
  publish-image:
    name: Publish ${{ matrix.platform }} image to GHCR
    needs: [gate, docker-preview]
    if: ${{ needs.gate.outputs.publish == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/yuriisokolenko/bodich-lan-preview
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bodich-lan-preview-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image
      - name: Load and verify the tested image
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/image/bodich-lan-preview-${ARCH}.tar"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' bodich-lan-preview:local)" = "$TARGET_PLATFORM"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' bodich-lan-preview:local)" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.bodich.source-state"}}' bodich-lan-preview:local)" = "clean"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' bodich-lan-preview:local)" = "https://github.com/${GITHUB_REPOSITORY}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push per-architecture image
        shell: bash
        run: |
          set -euo pipefail
          target="${IMAGE}:sha-${SOURCE_SHA}-${ARCH}"
          # A sha-* tag only ever points at the image built from that commit,
          # so a re-run for the same commit keeps what is already published.
          if docker buildx imagetools inspect "$target" > /dev/null 2>&1; then
            echo "$target already exists; not overwriting."
            exit 0
          fi
          docker tag bodich-lan-preview:local "$target"
          docker push "$target"

  publish-manifest:
    name: Publish multi-arch tags to GHCR
    needs: [gate, publish-image]
    if: ${{ needs.gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    # Serialize tag moves per moving tag (main or pr-<number>): two runs never
    # write the same moving tag at the same time.
    # queue: max keeps every waiting publisher. With the default queue, a group
    # holds only one pending job and a newcomer cancels it. Jobs reach this
    # group in build-completion order, not commit order, so an older,
    # slower-building run could cancel the newest commit's publisher.
    # queue: max needs cancel-in-progress: false; scripts/ghcr-publish.test.mjs
    # asserts both. (actionlint 1.7.12 does not know the `queue` key yet.)
    concurrency:
      group: ghcr-publish-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      cancel-in-progress: false
      queue: max
    env:
      IMAGE: ghcr.io/yuriisokolenko/bodich-lan-preview
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # How main / pr-<number> converge on the newest published commit:
      # - The tag only ever moves to the current branch head, read from the
      #   GitHub API, never to an older commit.
      # - Every run reconciles, not only the head's own run. If the head is a
      #   newer commit whose image already passed this workflow's checks
      #   (sha-<head>, or both of its per-arch images), this run promotes that
      #   commit. This covers a newest publisher that was cancelled, failed
      #   while promoting, or was dropped from a full queue.
      # - After every write the head is read again, and the loop reconciles if
      #   it moved. A head whose image is not published yet is left to its own
      #   run, which can only write after its image exists, i.e. after this read.
      # - Right after each write the moving tag is checked against the sha
      #   manifest by digest.
      # The sha-<SHA> tags are the only thing downstream jobs rely on.
      # scripts/ghcr-publish.test.mjs runs this exact script against stubbed
      # docker/gh, including the cancelled-newest-publisher case.
      - name: Create multi-arch image and promote the moving tag
        id: promote
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            moving_tag="pr-${PR_NUMBER}"
            head_endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
            head_jq=.head.sha
          else
            moving_tag=main
            head_endpoint="repos/${GITHUB_REPOSITORY}/commits/main"
            head_jq=.sha
          fi
          latest_sha() { gh api "$head_endpoint" --jq "$head_jq"; }
          exists() { docker buildx imagetools inspect "${IMAGE}:$1" > /dev/null 2>&1; }
          sha256() { if command -v sha256sum > /dev/null; then sha256sum; else shasum -a 256; fi; }
          manifest_digest() { docker buildx imagetools inspect "${IMAGE}:$1" --raw | sha256 | cut -d' ' -f1; }
          # Create sha-<commit> from its two per-arch images (pushed only after
          # every Docker preview check passed for that commit) unless it exists,
          # then require exactly linux/amd64 + linux/arm64.
          publish_sha_manifest() {
            local tag="sha-$1"
            if exists "$tag"; then
              echo "${tag} already published; keeping it."
            else
              docker buildx imagetools create --tag "${IMAGE}:${tag}" "${IMAGE}:${tag}-amd64" "${IMAGE}:${tag}-arm64"
            fi
            docker buildx imagetools inspect "${IMAGE}:${tag}" --raw > "$RUNNER_TEMP/index.json"
            python3 - "$RUNNER_TEMP/index.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              index = json.load(f)
          platforms = sorted(f"{m['platform']['os']}/{m['platform']['architecture']}" for m in index['manifests'])
          assert platforms == ['linux/amd64', 'linux/arm64'], platforms
          PY
          }
          # True when the commit's image passed this workflow's checks and was pushed.
          is_published() { exists "sha-$1" || { exists "sha-$1-amd64" && exists "sha-$1-arm64"; }; }

          publish_sha_manifest "$SOURCE_SHA"

          points_at=""
          stable=false
          head="$(latest_sha)"
          for _attempt in 1 2 3 4 5; do
            if [ "$head" != "$SOURCE_SHA" ] && ! is_published "$head"; then
              echo "::notice::${moving_tag} left for ${head}: its image is not published yet, and its own run promotes it once it is."
              stable=true
              break
            fi
            if [ "$head" != "$SOURCE_SHA" ]; then
              echo "::notice::${head} is newer than ${SOURCE_SHA} and already passed its checks; promoting ${moving_tag} to it."
              publish_sha_manifest "$head"
            fi
            if ! exists "$moving_tag" || [ "$(manifest_digest "$moving_tag")" != "$(manifest_digest "sha-${head}")" ]; then
              docker buildx imagetools create --tag "${IMAGE}:${moving_tag}" "${IMAGE}:sha-${head}"
            fi
            if [ "$(manifest_digest "$moving_tag")" != "$(manifest_digest "sha-${head}")" ]; then
              echo "::error::${moving_tag} does not match sha-${head} after promotion."
              exit 1
            fi
            points_at="$head"
            head="$(latest_sha)"
            if [ "$head" = "$points_at" ]; then
              stable=true
              break
            fi
            echo "::warning::${head} landed while ${moving_tag} was being promoted to ${points_at}; reconciling."
          done
          if [ "$stable" != true ]; then
            echo "::warning::${moving_tag} still chasing a moving head after 5 attempts; the newer commits' own runs promote it."
          fi

          promoted=false
          [ "$points_at" = "$SOURCE_SHA" ] && promoted=true
          {
            echo "promoted=${promoted}"
            echo "moving_tag=${moving_tag}"
            echo "points_at=${points_at}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Published GHCR preview image"
            echo
            echo "- Image: \`${IMAGE}\` (linux/amd64, linux/arm64)"
            echo "- Immutable tag: \`sha-${SOURCE_SHA}\`"
            if [ "$promoted" = true ]; then
              echo "- \`${moving_tag}\` now points at this commit"
            elif [ -n "$points_at" ]; then
              echo "- \`${moving_tag}\` promoted to newer commit \`${points_at}\`"
            else
              echo "- \`${moving_tag}\` not moved (a newer commit's run promotes it)"
            fi
            echo "- Run it: \`export BODICH_IMAGE_TAG=${moving_tag} COMPOSE_FILE=compose.yaml:compose.ghcr.yaml && docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    name: Verify pulled ${{ matrix.platform }} image
    needs: [gate, publish-manifest]
    if: ${{ needs.gate.outputs.publish == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      BODICH_BIND_IP: 127.0.0.1
      BODICH_PORT: 4321
      # Verify through the immutable sha tag: a newer run may legitimately move
      # main / pr-<number> while this job is still queued. The moving tag is
      # checked against this exact manifest at promotion time instead.
      BODICH_IMAGE_TAG: sha-${{ github.event.pull_request.head.sha || github.sha }}
      # The documented one-command flow: plain `docker compose pull` / `up -d`.
      COMPOSE_FILE: compose.yaml:compose.ghcr.yaml
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published image and start it with Compose
        run: |
          docker compose pull
          docker compose up --detach --no-build
      - name: Check EN/RO routes, assets, and HTTP security
        run: python3 scripts/docker-preview-smoke.py http://127.0.0.1:4321/
      - name: Verify pulled image runtime and build provenance
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker compose ps -q bodich-preview)"
          test -n "$container"
          image="ghcr.io/yuriisokolenko/bodich-lan-preview:${BODICH_IMAGE_TAG}"
          test "$(docker inspect --format '{{.Config.Image}}' "$container")" = "$image"
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = "101:101"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container")" = "true"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$container" | grep -q 'ALL'
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container" | grep -q 'no-new-privileges'
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "$TARGET_PLATFORM"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$EXPECTED_SOURCE_SHA"
          docker compose exec --no-TTY bodich-preview cat /usr/share/bodich/build-provenance.json > "$RUNNER_TEMP/bodich-build-provenance.json"
          python3 - "$RUNNER_TEMP/bodich-build-provenance.json" <<'PY'
          import json, os, re, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              p = json.load(f)
          assert p['profile'] == 'release_safe', p['profile']
          assert p['sourceSha'] == os.environ['EXPECTED_SOURCE_SHA'], p['sourceSha']
          assert p['sourceState'] == 'clean', p['sourceState']
          assert re.fullmatch(r'[0-9a-f]{64}', p['distManifestSha256'])
          assert p['distFileCount'] > 0
          print(json.dumps(p, sort_keys=True))
          PY
      - name: Show preview logs after failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop preview
        if: always()
        run: docker compose down --remove-orphans
