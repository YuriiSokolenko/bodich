name: Temporary KingTech complete-source reproduction

on:
  push:
    branches: [feature/issue-25-kingtech-source-inventory]
    paths: [.github/workflows/kingtech-probe.yml]

permissions:
  contents: read

jobs:
  verify-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned browser tools
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --only-shell chromium
      - name: Preserve committed inventory snapshot
        run: cp docs/catalog/source-inventory.json /tmp/previous-kingtech.json
      - name: Fresh crawl of numeric and opaque product IDs
        run: node scripts/audit-kingtech-source.mjs --write --browser
      - name: Validate refreshed inventory and preservation of all prior records
        run: |
          npm run catalog:source:check
          node scripts/validate-source-inventory.mjs --compare=/tmp/previous-kingtech.json
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const before = JSON.parse(readFileSync('/tmp/previous-kingtech.json','utf8'));
          const now = JSON.parse(readFileSync('docs/catalog/source-inventory.json','utf8'));
          const old = new Set(before.products.map(p => p.id)), refreshed = new Set(now.products.map(p => p.id));
          const gone = [...old].filter(x=>!refreshed.has(x)), added = [...refreshed].filter(x=>!old.has(x));
          const alpha = now.products.filter(p=>p.sourceOpaqueId).length;
          const direct = now.products.filter(p=>p.sourceDiscovery==='direct_verified_unlisted').length;
          console.log(JSON.stringify({old:old.size,current:refreshed.size,missing:gone,added,alpha,direct,warnings:now.warnings,sections:now.sections.map(s=>({id:s.id,reported:s.reportedCount,discovered:s.discoveredCount,status:s.status,subcategories:s.subcategories?.filter(c=>/engine-bracket|\/pump\//.test(c.url))}))},null,2));
          if (gone.length || added.length || old.size !== 132 || refreshed.size !== 132 || alpha !== 5 || direct !== 4 || now.warnings.length) {
            throw Error('Fresh crawl failed to reproduce the complete 132-item source inventory.');
          }
          JS
      - name: Upload independently refreshed source snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kingtech-complete-reproduction
          path: docs/catalog/source-inventory.json
          if-no-files-found: error
          retention-days: 7
