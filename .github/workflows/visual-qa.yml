name: Browser Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'public/**'
      - '.nvmrc'
      - 'tsconfig.json'
      - 'tailwind.config.*'
      - 'vite.config.*'
      - 'scripts/visual-qa.mjs'
      - 'scripts/reconcile-catalog-release.mjs'
      - 'docs/catalog/**'
      - 'docs/qa/issue-35-release-readiness.md'
      - '.github/workflows/ci.yml'
      # Catalog safety checks are executed by Browser QA before screenshots.
      - 'scripts/catalog-image*.mjs'
      - 'scripts/catalog-fixtures.mjs'
      - 'scripts/validate-catalog.mjs'
      - 'scripts/verify-product-fixture.mjs'
      - '.github/workflows/visual-qa.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked app dependencies
        run: npm ci

      - name: Check Astro/TypeScript and build locked dependencies
        run: |
          npm run check
          npm run build

      # Browser tooling is added only after the production build is created:
      # no post-install changes can affect the tested Astro output.
      - name: Install pinned browser test library (after build)
        run: npm install --no-save --package-lock=false playwright@1.64.1

      - name: Install headless Chromium (runner provides Linux system libraries)
        run: npx playwright install --only-shell chromium

      - name: Launch production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/bodich-preview.log 2>&1 &
          echo $! > /tmp/bodich-preview.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4321/en/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bodich-preview.log
          exit 1

      - name: Check responsive layouts and interactions; capture screenshots
        run: node scripts/visual-qa.mjs

      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodich-visual-qa-${{ github.run_id }}
          path: visual-qa/
          retention-days: 14
          if-no-files-found: warn
