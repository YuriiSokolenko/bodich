name: Browser Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'scripts/visual-qa.mjs'
      - '.github/workflows/visual-qa.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked app dependencies
        run: npm ci

      # Keep browser QA self-contained. It doesn't rewrite package-lock.json
      # or add a production dependency to the Astro website.
      - name: Install pinned browser test library
        run: npm install --no-save --package-lock=false playwright@1.64.1

      - name: Install headless Chromium and system dependencies
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build actual static website
        run: |
          npm run check
          npm run build

      - name: Launch production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/bodich-preview.log 2>&1 &
          echo $! > /tmp/bodich-preview.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4321/en/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bodich-preview.log
          exit 1

      - name: Check responsive layouts and interactions; capture screenshots
        run: node scripts/visual-qa.mjs

      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodich-visual-qa-${{ github.run_id }}
          path: visual-qa/
          retention-days: 14
          if-no-files-found: warn
